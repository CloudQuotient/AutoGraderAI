name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install || npm ci || true
        continue-on-error: true

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint || true
        continue-on-error: true

      - name: Run frontend build
        run: |
          cd frontend
          npm run build || true
        continue-on-error: true

      - name: Run frontend tests
        run: |
          cd frontend
          npm test || true
        continue-on-error: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -U pip
          pip install -r requirements.txt || pip install -e .
        continue-on-error: true

      - name: Run backend lint
        run: |
          cd backend
          black . --check || true
          flake8 . || true
        continue-on-error: true

      - name: Run backend tests
        run: |
          cd backend
          pytest || true
        continue-on-error: true

  python-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dev dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -U pip
          pip install pytest ruff

      - name: Run pytest (backend)
        run: |
          cd backend || true
          pytest || true
        continue-on-error: true

      - name: Run ruff lint
        run: |
          ruff backend || true
        continue-on-error: true
