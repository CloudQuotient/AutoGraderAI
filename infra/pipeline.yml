AWSTemplateFormatVersion: '2010-09-09'
Description: AutoGrader.AI CodePipeline
Resources:
  AutoGraderPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: arn:aws:iam::<account-id>:role/CodePipelineRole
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: 1
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                Owner: CloudQuotient
                Repo: AutoGraderAI
                Branch: main
                OAuthToken: <github-token-secret>
        - Name: Build
          Actions:
            - Name: BackendBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BackendBuildOutput
              Configuration:
                ProjectName: AutoGraderBackendBuild
            - Name: FrontendBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: FrontendBuildOutput
              Configuration:
                ProjectName: AutoGraderFrontendBuild
        - Name: Deploy
          Actions:
            - Name: DeployBackendECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: 1
              InputArtifacts:
                - Name: BackendBuildOutput
              Configuration:
                ClusterName: AutoGraderECSCluster
                ServiceName: AutoGraderBackendService
            - Name: DeployFrontendAmplify
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: Amplify
                Version: 1
              InputArtifacts:
                - Name: FrontendBuildOutput
              Configuration:
                AppId: <amplify-app-id>
