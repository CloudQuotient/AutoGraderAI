openapi: 3.0.1
info:
  title: AutoGraderAI API
  version: 1.0.0
paths:
  /submit:
    post:
      summary: Submit assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignmentId:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Submission accepted
  /feedback/{id}:
    get:
      summary: Get feedback for submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feedback JSON
  /plagiarism/{id}:
    get:
      summary: Get plagiarism report for submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plagiarism report JSON
  /dashboard/{role}:
    get:
      summary: Get dashboard data by role
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [student, instructor, admin]
      responses:
        '200':
          description: Dashboard data JSON
